# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en"
early_access: false

tone_instructions: "Skeptical, direct engineering tone. Prioritize KISS. Ruthlessly flag over-engineering, hyper-abstraction, boilerplate bloat, and fragile logic. Demand simpler approaches instead of optimizing complex designs."
reviews:

  profile: "assertive" 
  request_changes_workflow: true
  review_status: true
  high_level_summary: true
  collapse_walkthrough: true
  poem: false

  path_instructions:
    - path: "backend/**/*"
      instructions: |
        Review backend code with deep skepticism regarding durability and error limits.
        - Check for unhandled exceptions, missing database constraints, and sloppy data mapping.
        - Actively reject convoluted data transformation loops. Keep queries and logic bone-simple.
        - Do not accept unnecessary structural layers or over-designed design patterns.

    - path: "frontend/**/*"
      instructions: |
        Focus heavily on interface clarity and structural simplicity.
        - Flag redundant state trackers, deeply nested custom hooks, and logic loops causing re-renders.
        - Reject overly engineered UI frameworks or wrapper logic when native implementations are cleaner.
        - Ensure components are readable at a quick glance without sprawling helper functions.

    - path: "pipeline/**/*"
      instructions: |
        Treat deployment and pipeline setups as high-risk infrastructure.
        - Flag complex inline bash logic, missing exit fail-safes, or obscure tool configurations.
        - Demand simple, declarative runner actions over nested custom script architectures.
