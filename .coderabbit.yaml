# yaml-language-server: \$schema=https://coderabbit.ai
language: "en-US"
early_access: false

# 1. PRAGMATIC SKEPTIC TONE (Strict on correctness, ruthless against complexity)
tone_instructions: |
  Maintain a formal, direct, and inherently skeptical engineering tone. 
  Approach the code with a critical eye, looking for hidden assumptions, fragile logic, and actual security risks.
  However, filter your skepticism entirely through the KISS (Keep It Simple, Stupid) principle:
  - Do not overthink or invent abstract, hypothetical edge cases.
  - Ruthlessly flag over-engineering, unnecessary abstractions, and boilerplate bloat.
  - If a solution is overly complex, demand a simpler approach rather than fixing the complex one.
  - Be direct: point out the risk, explain why the current simple code is broken, or why the current complex code is unnecessary.

reviews:
  # 2. CALIBRATION (Assertive ensures it doesn't stay quiet, but tone_instructions keeps it grounded)
  profile: "assertive" 
  
  # 3. GATEKEEPING (Enforce strictness by requiring fixes for valid skeptical findings)
  request_changes_workflow: true
  review_status: true

  # 4. STRUCTURE
  high_level_summary: true
  collapse_walkthrough: true
  poem: false

  # 5. PATH INSTRUCTIONS FOR WORKFLOWS
  path_instructions:
    - path: ".github/workflows/**/*"
      instructions: |
        Review with high skepticism but strict adherence to simplicity:
        - Look for actual fragile points (e.g., untrusted script inputs, unpinned actions, missing error handling).
        - Actively reject workflows that use 5 steps or complex third-party tools when a single, simple bash command suffices.
        - Ensure security is maintained without adding convoluted procedural layers.
